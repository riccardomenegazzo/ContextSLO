apiVersion: apps/v1
kind: DaemonSet
metadata: {name: contextslo-sensor, namespace: contextslo-system}
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: contextslo, app.kubernetes.io/component: truth-sensor}
  template:
    metadata:
      labels: {app.kubernetes.io/name: contextslo, app.kubernetes.io/component: truth-sensor}
    spec:
      serviceAccountName: contextslo-sensor
      hostPID: true
      containers:
        - name: sensor
          image: contextslo-sensor:local
          imagePullPolicy: IfNotPresent
          args: ["--server", "http://contextslo.contextslo-system.svc:8080", "--cluster", "default"]
          env:
            - name: CONTEXTSLO_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: contextslo-api
                  key: token
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {add: [BPF, PERFMON, SYS_RESOURCE, DAC_READ_SEARCH], drop: [ALL]}
            seccompProfile: {type: Unconfined}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 300m, memory: 128Mi}
