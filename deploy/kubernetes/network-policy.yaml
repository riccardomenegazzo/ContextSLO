apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: contextslo, namespace: contextslo-system}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: contextslo}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {}
      ports: [{protocol: TCP, port: 8080}]
  egress:
    - to:
        - namespaceSelector: {}
    - to:
        - ipBlock: {cidr: 0.0.0.0/0}
      ports: [{protocol: TCP, port: 443}, {protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
