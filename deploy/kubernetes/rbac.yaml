apiVersion: v1
kind: ServiceAccount
metadata: {name: contextslo, namespace: contextslo-system}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: contextslo-operator, namespace: contextslo-system}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: contextslo-canary, namespace: contextslo-system}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: contextslo-operator}
rules:
  - apiGroups: [contextslo.io]
    resources: [securitycontextsloes]
    verbs: [get, list, watch]
  - apiGroups: [contextslo.io]
    resources: [securitycontextsloes/status]
    verbs: [get, patch, update]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: contextslo-operator}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: contextslo-operator}
subjects:
  - {kind: ServiceAccount, name: contextslo-operator, namespace: contextslo-system}
