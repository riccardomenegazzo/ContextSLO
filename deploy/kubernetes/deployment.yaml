apiVersion: apps/v1
kind: Deployment
metadata:
  name: contextslo
  namespace: contextslo-system
  labels: {app.kubernetes.io/name: contextslo, app.kubernetes.io/component: server}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: contextslo, app.kubernetes.io/component: server}
  template:
    metadata:
      labels: {app.kubernetes.io/name: contextslo, app.kubernetes.io/component: server}
    spec:
      serviceAccountName: contextslo
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: contextslo
          image: contextslo:local
          imagePullPolicy: IfNotPresent
          args: ["serve", "--listen", ":8080", "--data", "/data/state.json", "--seed-demo=false"]
          env:
            - {name: CONTEXTSLO_CLUSTER, value: default}
            - {name: CONTEXTSLO_COLLECTION_WAIT, value: 10s}
            - name: CONTEXTSLO_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: contextslo-api
                  key: token
                  optional: true
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /readyz, port: http}, initialDelaySeconds: 2, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 5, periodSeconds: 10}
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: data, mountPath: /data}, {name: tmp, mountPath: /tmp}]
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: contextslo-data}}
        - {name: tmp, emptyDir: {sizeLimit: 32Mi}}
